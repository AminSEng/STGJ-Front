<div class="register-container">
  <h2>Register</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" class="form-control" />
      <div *ngIf="name?.invalid && name?.touched" class="text-danger">
        Name is required.
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" class="form-control" />
      <div *ngIf="email?.invalid && email?.touched" class="text-danger">
        Valid email is required.
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" class="form-control" />
      <div *ngIf="password?.invalid && password?.touched" class="text-danger">
        Password must be at least 6 characters.
      </div>
    </div>

    <div class="form-group">
      <label>addressRecuperation (optional)</label>
      <input type="text" formControlName="addressRecuperation" class="form-control" />
    </div>

    <div class="form-group">
      <label>Role</label>
      <select formControlName="role" class="form-control">
        <option value="PASSENGER">Passenger</option>
        <option value="DRIVER">Driver</option>
      </select>
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" formControlName="address" class="form-control" />
    </div>

    <div class="form-group" *ngIf="role?.value === 'PASSENGER'">
      <label>Pickup Address (Address de récupération)</label>
      <input type="text" formControlName="addressRecuperation" class="form-control" />
    </div>

    <div class="form-group" *ngIf="role?.value === 'DRIVER'">
      <label>
        <input type="checkbox" formControlName="disponibilite" />
        Available for driving?
      </label>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

    <button class="btn btn-success" type="submit" [disabled]="isSubmitting || registerForm.invalid">
      {{ isSubmitting ? 'Registering...' : 'Register' }}
    </button>
  </form>

  <p class="mt-3">
    Already have an account?
    <a routerLink="/login">Login here</a>
  </p>
</div>

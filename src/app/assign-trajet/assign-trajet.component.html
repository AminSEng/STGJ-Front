<div class="assign-container">
  <h2>Assign Trajet to Driver</h2>

  <form [formGroup]="assignForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Driver</label>
      <select class="form-control" formControlName="driverId">
        <option [ngValue]="null">-- Select Driver --</option>
        <option *ngFor="let driver of drivers" [value]="driver.userId">{{ driver.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Trajet</label>
      <select class="form-control" formControlName="trajetId">
        <option [ngValue]="null">-- Select Trajet --</option>
        <option *ngFor="let trajet of trajets" [value]="trajet.id">{{ trajet.nom }}</option>
      </select>
    </div>

    <button class="btn btn-success mt-2" [disabled]="assignForm.invalid">Assign</button>
  </form>

  <div *ngIf="message" class="alert alert-success mt-3">{{ message }}</div>
  <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
</div>
